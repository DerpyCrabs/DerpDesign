<!doctype html><meta charset="utf-8"><style>body{margin:12px;background:#edf2f7;font:16px sans-serif}select{display:block;width:220px;height:36px}output{display:block;margin-top:12px}#outside{margin-top:12px}</style>
<select id="choice"><option value="first">First option</option><option disabled>Unavailable</option><optgroup label="Available group"><option value="second">Second option</option><option value="third">Third option</option></optgroup><hr><option value="last">Last option</option></select>
<output id="value">first</output><button id="outside" onclick="this.textContent='Clicked'">Outside</button>
<select id="long"><option>Item 0</option></select>
<script>
choice.addEventListener('change',()=>value.textContent=choice.value);
for(let i=1;i<40;i++)long.add(new Option('Item '+i,String(i)));
long.addEventListener('change',()=>value.textContent=long.value);
</script>
